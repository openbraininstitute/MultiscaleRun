[base]
name = multiscale_run

[tox]
envlist =
    check-packaging
    lint
    docs

[testenv]
pass_env = *
deps =
    pytest

[testenv:docs]
changedir = {toxinidir}
extras = docs
commands = sphinx-build -W --keep-going docs docs/build/html

[testenv:lint]
skip_install = true
deps =
    ruff
    codespell
commands =
    ruff check --fix
    codespell --config .codespellrc -i 3 -w {[base]files} README.md docs/

[testenv:unit]
deps =
    {[testenv]deps}
    pytest-profiling
setenv =
    NEURON_INIT_MPI=0
commands =
    pytest --ignore=old {posargs:tests/unit}

