name: Integration tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [mpi]
    env:
      SONATAREPORT_DIR: ${{ github.workspace }}/libsonatareport/build/install
      NEURODAMUS_NEOCORTEX_ROOT: ${{ github.workspace }}/neurodamus-models/build/install
      HOC_LIBRARY_PATH: ${{ github.workspace }}/neurodamus-models/build/install/share/neurodamus_neocortex/hoc
      LIBSONATA_ZERO_BASED_GIDS: 1
      HDF5_MPI: ON
      NRNMECH_LIB_PATH: ${{ github.workspace }}/neurodamus-models/build/install/lib/libnrnmech.so

    steps:
    - uses: actions/checkout@v4
    
    - name: Install ubuntu system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-mpi-dev hdf5-tools flex libfl-dev bison ninja-build libreadline-dev build-essential wget

    - name: Build OpenMPI 5 from source
      run: |
        OPENMPI_VERSION=5.0.9
        mkdir -p $HOME/openmpi_build
        cd $HOME/openmpi_build
        wget https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-$OPENMPI_VERSION.tar.gz
        tar xf openmpi-$OPENMPI_VERSION.tar.gz
        cd openmpi-$OPENMPI_VERSION
        ./configure --prefix=$HOME/openmpi --enable-mpi-cxx --enable-mpi-fortran
        make -j$(nproc)
        make install

        # Add to PATH and LD_LIBRARY_PATH
        echo "$HOME/openmpi/bin" >> $GITHUB_PATH
        echo "$HOME/openmpi/lib" >> $GITHUB_ENV
        export LD_LIBRARY_PATH=$HOME/openmpi/lib:$LD_LIBRARY_PATH
    
    - name: Check MPI HDF5 installation
      run: |
        echo "Which mpicc/mpirun/mpicxx/mpiexec:"
        which mpicc
        which mpicxx
        which mpirun
        which mpiexec

        echo "Find parallel HDF5 headers:"
        dpkg -L libhdf5-mpi-dev | grep hdf5.h || true

        echo "Find parallel HDF5 libs:"
        dpkg -L libhdf5-mpi-dev | grep libhdf5 || true

        echo "Verify parallel HDF5 linkage:"
        ldd /usr/lib/x86_64-linux-gnu/hdf5/openmpi/libhdf5.so 2>/dev/null | grep mpi || echo "Not linked to MPI"


